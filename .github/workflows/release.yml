name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create a GitHub Release"
        type: boolean
        default: true
      sign:
        description: "Sign artifacts with SignPath (after approval)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.tagcheck.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version consistency
        shell: pwsh
        run: ./scripts/check-version.ps1

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Frontend tests (Vitest)
        run: npm run test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          Add-Content $env:GITHUB_OUTPUT "tag=v$version"

      - name: Check whether the tag already exists
        id: tagcheck
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          $existing = git tag --list $tag
          if ($existing) {
            Add-Content $env:GITHUB_OUTPUT "should_release=false"
            Write-Host "Tag $tag already exists; release creation is skipped."
          } else {
            Add-Content $env:GITHUB_OUTPUT "should_release=true"
          }

      # 2.2.0+ clients install an update only when the asset carries a valid
      # minisign signature (src-tauri/src/signing.rs), and the binary verifies it
      # against the public key compiled in from SPLITLINE_UPDATE_PUBKEY. A build
      # without that key would ship an app that refuses every update, so a
      # release build must have it. The value is a repository *variable*: the
      # public key is not a secret, and it has to be visible for auditing.
      - name: Check update signing key
        if: steps.tagcheck.outputs.should_release == 'true'
        shell: pwsh
        env:
          SPLITLINE_UPDATE_PUBKEY: ${{ vars.SPLITLINE_UPDATE_PUBKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPLITLINE_UPDATE_PUBKEY)) {
            throw "Ключ подписи не настроен: переменная репозитория SPLITLINE_UPDATE_PUBKEY пуста. Сгенерируйте пару ключей через scripts/generate-signing-key.ps1, добавьте публичный ключ в переменную SPLITLINE_UPDATE_PUBKEY и секреты MINISIGN_SECRET_KEY / MINISIGN_SECRET_KEY_PASSWORD."
          }

      - name: Build Tauri app (portable exe)
        env:
          SPLITLINE_UPDATE_PUBKEY: ${{ vars.SPLITLINE_UPDATE_PUBKEY }}
        run: npm run tauri build

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # `dist` is Vite's frontend output. Never stage release files there:
          # that is how index.html/icon.png leaked into v1.1.1.
          $stage = "release-artifacts"
          New-Item -ItemType Directory -Force $stage | Out-Null

          # The binary name comes from `mainBinaryName`; fall back to the crate
          # name so the workflow keeps working if that setting is dropped.
          $built = @(
            "src-tauri/target/release/Splitline.exe",
            "src-tauri/target/release/zapret-ui.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $built) { throw "Built exe was not found in src-tauri/target/release" }

          Copy-Item $built "$stage/Splitline.exe"

          # README/LICENSE/notices go into the portable zip, not into the release root.
          Compress-Archive -Path @(
            "$stage/Splitline.exe",
            "README.md",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md"
          ) -DestinationPath "$stage/Splitline_${version}_x64_portable.zip" -Force

          # No SHA256SUMS.txt: GitHub publishes a `sha256:<hex>` digest for every
          # uploaded asset, and the updater verifies that digest (updater.rs).
          Get-ChildItem $stage | Format-Table Name, Length

      # Every released asset must carry a detached minisign signature: the
      # updater looks for `<asset>.sig` and refuses to install anything without
      # a valid one. So a release build without the signing secrets fails here
      # instead of quietly publishing an unsigned (uninstallable) release.
      #
      # R8: the private key arrives through a repository secret, lives in a
      # temporary file for the duration of this step and is deleted afterwards.
      # Nothing in this step prints the key or the password; only file names and
      # sizes reach the log.
      - name: Sign release artifacts
        if: steps.tagcheck.outputs.should_release == 'true'
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_SECRET_KEY_PASSWORD: ${{ secrets.MINISIGN_SECRET_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_SECRET_KEY)) {
            throw "Релиз не подписан: секрет MINISIGN_SECRET_KEY не задан. Сгенерируйте ключ через scripts/generate-signing-key.ps1 и добавьте секреты MINISIGN_SECRET_KEY и MINISIGN_SECRET_KEY_PASSWORD."
          }

          # `tauri signer sign` takes the key file `tauri signer generate`
          # writes, and puts the signature next to each file as `<name>.sig`.
          $keyPath = Join-Path $env:RUNNER_TEMP "splitline-signing.key"
          try {
            Set-Content -Path $keyPath -Value $env:MINISIGN_SECRET_KEY -NoNewline

            $files = @(
              (Resolve-Path "release-artifacts/Splitline.exe").Path,
              (Resolve-Path "release-artifacts/Splitline_*_portable.zip").Path
            )
            foreach ($file in $files) {
              $arguments = @("--no-install", "tauri", "signer", "sign", "-f", $keyPath)
              if (-not [string]::IsNullOrEmpty($env:MINISIGN_SECRET_KEY_PASSWORD)) {
                $arguments += @("-p", $env:MINISIGN_SECRET_KEY_PASSWORD)
              }
              $arguments += $file
              & npx @arguments
              if ($LASTEXITCODE -ne 0) {
                throw "Не удалось подписать $(Split-Path -Leaf $file)."
              }
              if (-not (Test-Path "$file.sig")) {
                throw "После подписи $(Split-Path -Leaf $file) не появился файл .sig."
              }
            }
          }
          finally {
            Remove-Item -Force $keyPath -ErrorAction SilentlyContinue
          }

          # The updater resolves the signature as `<asset name>.sig`.
          Get-ChildItem "release-artifacts/*.sig" | Format-Table Name, Length
          $version = "${{ steps.version.outputs.version }}"
          Write-Host "Подписаны Splitline.exe и Splitline_${version}_x64_portable.zip"

      # SignPath is added after the OSS application is approved (see TODO.md).
      # It is Authenticode (Windows code reputation, SmartScreen), a different
      # thing from the minisign signature above: the updater trusts the minisign
      # key, Windows reputation trusts the certificate.
      #
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v3
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: zapret-ui
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: initial
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    # While the repository is private, a push only builds artifacts. A manual
    # run with make_release=true can publish a private test release.
    if: >-
      ${{
        needs.build.outputs.should_release == 'true' &&
        (
          (github.event_name == 'push' && github.event.repository.private == false) ||
          (github.event_name == 'workflow_dispatch' && inputs.make_release)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      # Second line of defence: an unsigned asset must not reach users even if
      # the build job was changed. The app would reject it anyway, but then
      # nobody could update at all.
      - name: Check that every asset is signed
        shell: pwsh
        run: |
          $assets = Get-ChildItem "release-artifacts" -File |
            Where-Object { $_.Extension -in ".exe", ".zip" }
          if (-not $assets) {
            throw "В артефактах нет exe или zip — публиковать нечего."
          }
          $unsigned = $assets | Where-Object { -not (Test-Path "$($_.FullName).sig") }
          if ($unsigned) {
            $names = ($unsigned | ForEach-Object Name) -join ", "
            throw "Релиз не подписан: нет файла .sig для $names. Публикация отменена."
          }
          Get-ChildItem "release-artifacts/*.sig" | ForEach-Object { Write-Host "Подпись: $($_.Name)" }

      - name: Extract release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version "${{ needs.build.outputs.version }}" -Output release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Splitline ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
